<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos | Soporte Técnico Cruz González</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); min-height: 100vh; }
        .navbar-custom { background: white; padding: 1rem 0; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .navbar-custom .nav-link { color: #2d3748; font-weight: 600; margin: 0 10px; }
        .card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: none; }
        .card-img-top { height: 200px; object-fit: cover; border-radius: 20px 20px 0 0; }
        .precio { font-size: 1.8rem; font-weight: 700; color: #0ea5e9; }
        .btn-wa { background: #25d366; color: white; border: none; padding: 10px; border-radius: 10px; text-decoration: none; display: block; text-align: center; font-weight: 600; }
        .btn-wa:hover { background: #128c7e; color: white; }
        h1 { color: white; text-align: center; padding: 3rem 0; font-weight: 700; }
    </style>
</head>
<body>

    <nav class="navbar-custom sticky-top">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-laptop-code text-primary"></i> Cruz González</a>
            <div class="d-flex flex-wrap">
                <a href="/" class="nav-link">Inicio</a>
                <a href="/equipos" class="nav-link">Equipos</a>
                <a href="/repuestos" class="nav-link">Repuestos</a>
                <a href="/servicios" class="nav-link">Servicios</a>
                <a href="/software" class="nav-link">Software</a>
                <a href="/contacto" class="nav-link">Contacto</a>
            </div>
        </div>
    </nav>

    <h1>🔧 Catálogo de Repuestos</h1>

    <div class="container pb-5">
        <div class="row g-4">
            {% for repuesto in repuestos %}
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="{{ repuesto.get('imagen_url', 'https://via.placeholder.com/400') }}" class="card-img-top" alt="{{ repuesto['nombre'] }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ repuesto['nombre'] }}</h5>
                        <p class="card-text text-muted">{{ repuesto['descripcion'] }}</p>
                        <p class="precio">${{ "{:,.0f}".format(repuesto['precio']) }} COP</p>
                        <a href="https://wa.me/573107616619?text=Hola,%20me%20interesa%20el%20repuesto:%20{{ repuesto['nombre'] }}" class="btn-wa" target="_blank">
                            <i class="fab fa-whatsapp"></i> Consultar
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
