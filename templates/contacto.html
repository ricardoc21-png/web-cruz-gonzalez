<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Soporte Técnico Cruz González</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar-custom { background: white; padding: 1rem 0; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .navbar-custom .nav-link { color: #2d3748; font-weight: 600; margin: 0 10px; }
        .contacto-card { background: white; border-radius: 20px; padding: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .contacto-item { padding: 1.5rem; border-bottom: 1px solid #edf2f7; }
        .contacto-item:last-child { border-bottom: none; }
        .contacto-icon { font-size: 2rem; color: #667eea; margin-right: 1rem; }
        h1 { color: white; text-align: center; padding: 3rem 0; font-weight: 700; }
        .btn-wa { background: #25d366; color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 1.2rem; display: inline-block; }
        .btn-wa:hover { background: #128c7e; color: white; }
    </style>
</head>
<body>

    <nav class="navbar-custom sticky-top">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-laptop-code text-primary"></i> Cruz González</a>
            <div class="d-flex flex-wrap">
                <a href="/" class="nav-link">Inicio</a>

                <a href="/contacto" class="nav-link">Contacto</a>
            </div>
        </div>
    </nav>

    <h1>📞 Contáctanos</h1>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="contacto-card">
                    <h2 class="mb-4">¿Cómo podemos ayudarte?</h2>
                    
                    <div class="contacto-item">
                        <i class="fab fa-whatsapp contacto-icon"></i>
                        <strong>WhatsApp:</strong>
                        <p class="mb-0">+57 310 761 6619</p>
                        <a href="https://wa.me/573107616619" class="btn-wa mt-2" target="_blank">
                            <i class="fab fa-whatsapp"></i> Chatear Ahora
                        </a>
                    </div>
                    
                    <div class="contacto-item">
                        <i class="fas fa-envelope contacto-icon"></i>
                        <strong>Email:</strong>
                        <p class="mb-0">ricardoc21@gmail.com</p>
                    </div>
                    
                    <div class="contacto-item">
                        <i class="fas fa-clock contacto-icon"></i>
                        <strong>Horario de Atención:</strong>
                        <p class="mb-0">Lunes a Sábado: 8:00 AM - 6:00 PM</p>
                    </div>
                    
                    <div class="contacto-item">
                        <i class="fas fa-map-marker-alt contacto-icon"></i>
                        <strong>Ubicación:</strong>
                        <p class="mb-0">Colombia - Atención presencial y remota</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
