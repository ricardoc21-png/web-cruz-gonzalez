<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software | Soporte Técnico Cruz González</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            min-height: 100vh;
        }
        .navbar-custom {
            background: white; box-shadow: 0 4px 20px rgba(14, 165, 233, 0.2);
            padding: 1rem 0; position: sticky; top: 0; z-index: 1000;
            border-bottom: 3px solid #0ea5e9;
        }
        .navbar-custom .nav-link { color: #0f172a; font-weight: 600; margin: 0 10px; }
        .navbar-custom .nav-link:hover { color: #0ea5e9; }
        .navbar-brand { color: #0ea5e9 !important; font-weight: 700; }
        h1 { color: white; text-align: center; padding: 3rem 0; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .card {
            border-radius: 20px; box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2);
            border: none; border-top: 4px solid #0ea5e9; transition: all 0.3s;
        }
        .card:hover { transform: translateY(-10px); border-top-color: #f59e0b; box-shadow: 0 20px 40px rgba(14, 165, 233, 0.3); }
        .card-img-top { height: 200px; object-fit: cover; border-radius: 20px 20px 0 0; }
        .card-title { color: #0f172a; font-weight: 700; }
        .card-text { color: #64748b; }
        .precio { font-size: 1.8rem; font-weight: 700; color: #0ea5e9; }
        .btn-wa {
            background: #25d366; color: white; border: none;
            padding: 10px; border-radius: 10px;
            text-decoration: none; display: block; text-align: center;
            font-weight: 600; transition: all 0.3s;
        }
        .btn-wa:hover { background: #128c7e; color: white; transform: scale(1.05); }
        .footer {
            background: white; margin-top: 3rem; padding: 2rem 0;
            text-align: center; border-top: 3px solid #0ea5e9;
        }
        .footer p { color: #64748b; margin: 0; }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <a class="navbar-brand" href="/"><i class="fas fa-laptop-code"></i> Cruz González</a>
            <div class="d-flex flex-wrap">
                <a href="/" class="nav-link">Inicio</a>
                <a href="/equipos" class="nav-link">Equipos</a>
                <a href="/repuestos" class="nav-link">Repuestos</a>
                <a href="/servicios" class="nav-link">Servicios</a>
                <a href="/software" class="nav-link">Software</a>
                <a href="/contacto" class="nav-link">Contacto</a>
            </div>
        </div>
    </nav>

    <h1>💿 Catálogo de Software</h1>

    <div class="container pb-5">
        <div class="row g-4">
            {% for sw in software %}
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="{{ sw.get('imagen_url', 'https://via.placeholder.com/400') }}" class="card-img-top" alt="{{ sw['nombre'] }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ sw['nombre'] }}</h5>
                        <p class="card-text">{{ sw['descripcion'] }}</p>
                        <p class="precio">${{ "{:,.0f}".format(sw['precio']) }} COP</p>
                        <a href="https://wa.me/573107616619?text=Hola,%20me%20interesa%20el%20software:%20{{ sw['nombre'] }}" class="btn-wa" target="_blank">
                            <i class="fab fa-whatsapp"></i> Consultar
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p><i class="fas fa-check-circle" style="color: #10b981;"></i> Software original con licencia</p>
            <p style="margin-top: 0.5rem;">© 2026 Soporte Técnico Cruz González</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
